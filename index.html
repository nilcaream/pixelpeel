<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1c1c22" />
    <meta name="description" content="Little dots peel a pixel picture apart, colour by colour. You choose the order." />
    <title>Pixel Peel</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="hud">
      <button id="menu-button" type="button" aria-label="Menu" aria-controls="menu" aria-expanded="false">☰</button>
      <span id="level-label"></span>
      <select id="level-chooser" aria-label="Level" hidden></select>
    </div>
    <canvas id="game"></canvas>
    <div id="menu" hidden>
      <div class="menu-panel" role="dialog" aria-modal="true" aria-labelledby="menu-title">
        <header>
          <h1 id="menu-title"><canvas id="menu-logo" aria-hidden="true"></canvas>Pixel Peel</h1>
          <button id="menu-close" type="button" aria-label="Close">✕</button>
        </header>
        <h2>Levels</h2>
        <div id="menu-levels"></div>
        <button id="menu-clear" type="button">Clear progress</button>
        <label id="menu-dev" hidden><input id="menu-dev-toggle" type="checkbox" /> Dev mode</label>
        <a id="menu-github" href="https://github.com/nilcaream/pixelpeel" target="_blank" rel="noopener">Pixel Peel on GitHub</a>
      </div>
    </div>
    <div id="end" hidden>
      <p id="end-text"></p>
      <button id="end-button" type="button"></button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
